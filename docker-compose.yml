services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sin puerto en host: evita conflicto si ya tienes Redis local en 6379

  consumet:
    image: riimuru/consumet-api:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      NODE_ENV: PROD
    depends_on:
      - redis
